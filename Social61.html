<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國小六年級社會 第一次段考模擬測驗 (10份試卷系統)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .math-input {
      font-family: inherit;
      text-align: center;
    }
    @media print {
      .no-print { display: none !important; }
      .exam-container { border: none !important; box-shadow: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
      .explanation-block { display: block !important; }
      body { background-color: white !important; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-8 text-slate-800 font-sans">

  <!-- 頂部導覽與切換面板 -->
  <header class="max-w-4xl mx-auto mb-6 bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-200 no-print">
    <div class="flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="bg-amber-100 text-amber-700 text-xs font-bold px-3 py-1 rounded-full">康軒版 社會科</span>
          <h1 class="text-xl font-bold text-slate-800">小六社會 第一次段考模擬測驗題庫系統</h1>
        </div>
        <p class="text-xs text-slate-500 mt-1">範圍：臺灣的地形與氣候、早期歷史與原住民文化、清領與日治時期 [10套完整卷]</p>
      </div>

      <!-- 卷別切換區 -->
      <div class="flex items-center gap-2 w-full md:w-auto justify-between md:justify-end">
        <button onclick="prevExam()" id="prevBtnHeader" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> 上一頁
        </button>
        
        <select id="examSelector" onchange="changeExam(parseInt(this.value))" class="bg-slate-50 border border-slate-300 text-slate-800 text-sm font-bold rounded-xl px-3 py-2 focus:ring-2 focus:ring-amber-500 outline-none">
          <!-- 10張試卷選項由 JS 動態注入 -->
        </select>

        <button onclick="nextExam()" id="nextBtnHeader" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed">
          下一頁 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>
      </div>
    </div>

    <!-- 功能按鈕列 -->
    <div class="flex justify-between items-center mt-4 pt-3 border-t border-slate-100">
      <div class="text-xs font-semibold text-slate-600">
        當前檢視：<span id="currentExamTitleDisplay" class="text-amber-600 font-bold">社會卷一</span>
      </div>
      <div class="flex gap-2">
        <button onclick="window.print()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg> 列印本卷
        </button>
        <button onclick="resetCurrentExam()" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold rounded-lg transition flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> 重作本卷
        </button>
      </div>
    </div>
  </header>

  <!-- 得分統計看板 -->
  <div id="scoreBanner" class="max-w-4xl mx-auto mb-6 bg-gradient-to-r from-amber-600 to-orange-600 text-white p-6 rounded-2xl shadow-lg hidden no-print">
    <div class="flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h2 class="text-2xl font-black" id="bannerExamTitle">社會卷一 測驗完成！</h2>
        <p class="text-amber-100 text-sm mt-1" id="scoreComment">評語載入中...</p>
      </div>
      <div class="flex items-baseline gap-1 bg-white/20 backdrop-blur-md px-6 py-3 rounded-2xl border border-white/30">
        <span class="text-5xl font-black" id="totalScore">0</span>
        <span class="text-lg opacity-80">/ 100 分</span>
      </div>
    </div>
  </div>

  <!-- 試卷主體渲染區 -->
  <main id="examContainer" class="exam-container max-w-4xl mx-auto bg-white p-6 md:p-10 rounded-2xl shadow-md border border-slate-200">
    <!-- JS 會在此載入對應試卷內容 -->
  </main>

  <!-- 底部導覽與交卷列 -->
  <footer class="max-w-4xl mx-auto mt-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4 no-print">
    <div class="flex gap-2 w-full md:w-auto">
      <button onclick="prevExam()" id="prevBtnFooter" class="flex-1 md:flex-none px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition flex items-center justify-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> 上一頁 (前一卷)
      </button>
      <button onclick="nextExam()" id="nextBtnFooter" class="flex-1 md:flex-none px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition flex items-center justify-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed">
        下一頁 (下一卷) <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>

    <button onclick="submitExam()" class="w-full md:w-auto px-8 py-3 bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-700 hover:to-orange-700 text-white font-bold text-base rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      交卷對答案 (計算本卷得分)
    </button>
  </footer>

  <script>
    // -------------------------------------------------------------
    // 社會科 10 份試卷資料庫
    // -------------------------------------------------------------
    const examDatabase = [
      // === 社會卷一 ===
      {
        id: 0,
        title: "第 1 套社會模擬試卷 (卷一)",
        mc: [
          { q: "臺灣的地形種類多樣，其中分佈面積最廣、占臺灣總面積比例最高的是下列何者？", ops: ["平原", "盆地", "山地", "臺地"], ans: "3", exp: "選 (3)。臺灣山地約占全島總面積的三分之二，是分佈最廣的地形。" },
          { q: "臺灣的氣候受到季風影響顯著，夏季吹西南風，冬季則盛行下列哪一種風向，並會帶來迎風面的降雨？", ops: ["東北季風", "西北季風", "東南季風", "落山風"], ans: "1", exp: "選 (1)。臺灣冬季受東北季風影響，北部與東北部降雨較多。" },
          { q: "早期臺灣原住民的生活與大自然息息相關，其中哪一個族群傳統上以嚴格的「會所制度（青年階層）」來訓練青少年並維持部落秩序？", ops: ["排灣族", "阿美族", "卑南族", "達悟族"], ans: "3", exp: "選 (3)。卑南族具有嚴格且完備的會所制度（少年會所與成年會所）。" },
          { q: "大航海時代時，哪一個國家曾於 17 世紀中葉在臺灣南部建立熱蘭遮城，並展開統治？", ops: ["西班牙", "荷蘭", "葡萄牙", "英國"], ans: "2", exp: "選 (2)。荷蘭人於 1624 年在安平建立熱蘭遮城（今臺南安平古堡）。" },
          { q: "鄭成功來臺驅逐荷蘭人後，設立了哪一個行政區作為在臺統治的最高根本？", ops: ["承天府", "臺灣府", "澎湖巡檢司", "臺北府"], ans: "1", exp: "選 (1)。鄭成功攻下熱蘭遮城後，改臺灣為「東都」，設承天府及天興、萬年二縣。" }
        ],
        fill: [
          { q: "臺灣地形中，四周地勢較高、中央地勢較低平的地形稱為 <input id='f0_0' class='math-input border-b-2 border-slate-400 w-24 text-amber-700 font-bold'>（例如臺北盆地）。", items: [{ id: "f0_0", ans: ["盆地"] }], ptsPerItem: 6, exp: "四周高、中間低的封閉地形稱為盆地。" },
          { q: "位於臺灣東南外海的蘭嶼，當地原住民族 <input id='f1_0' class='math-input border-b-2 border-slate-400 w-24 text-amber-700 font-bold'> 發展出特有的「飛魚文化」與半地穴式建築。", items: [{ id: "f1_0", ans: ["達悟族", "雅美族"] }], ptsPerItem: 6, exp: "蘭嶼的達悟族（雅美族）以飛魚文化聞名。" },
          { q: "17 世紀西班牙人曾短暫占領臺灣北部，並在今日基隆和平島一帶建立 <input id='f2_0' class='math-input border-b-2 border-slate-400 w-24 text-amber-700 font-bold'> 城。", items: [{ id: "f2_0", ans: ["聖薩爾瓦多城", "薩爾瓦多城"] }], ptsPerItem: 6, exp: "西班牙人在北臺灣建立聖薩爾瓦多城。" },
          { q: "清領初期，為了防止臺灣成為反清基地，曾頒布渡臺禁令，規定來臺漢人必須取得 <input id='f3_0' class='math-input border-b-2 border-slate-400 w-24 text-amber-700 font-bold'> 才能渡海。", items: [{ id: "f3_0", ans: ["渡臺執照", "執照"] }], ptsPerItem: 6, exp: "清廷為管制人口，規定需有渡臺執照。" },
          { q: "日治時期，日本總督府為了提升臺灣的農產量，特別在南部興建了大型水利工程 <input id='f4_0' class='math-input border-b-2 border-slate-400 w-24 text-amber-700 font-bold'>，使嘉南平原成為重要糧倉。", items: [{ id: "f4_0", ans: ["烏山頭水庫", "嘉南大圳", "烏山頭水庫與嘉南大圳"] }], ptsPerItem: 6, exp: "八田與一規劃興建烏山頭水庫與嘉南大圳。" }
        ],
        calc: [
          { q: "請回答臺灣兩大河川特色：(1) 臺灣最長的河流是？ (2) 臺灣流域面積最大的河流是？", inputs: [{ label: "(1) 最長河川", id: "c0_1" }, { label: "(2) 最大流域", id: "c0_2" }], ans: ["濁水溪", "高屏溪"], exp: "(1) 濁水溪全長約 186 公里為最長；(2) 高屏溪流域面積最大。" },
          { q: "清代臺灣開港通商後（1860年），北部有哪兩大港口開放對外通商？", inputs: [{ label: "港口一", id: "c1_1" }, { label: "港口二", id: "c1_2" }], ans: ["淡水", "基隆", "安平", "打狗"], exp: "開港通商口岸包含淡水、基隆、安平、打狗（任填兩個即可，此處預設淡水、基隆或安平、打狗）。" },
          { q: "日治時期推動的「內地延長主義」中，哪兩項為主要的同化政策？", inputs: [{ label: "政策一", id: "c2_1" }, { label: "政策二", id: "c2_2" }], ans: ["皇民化運動", "說國語", "改姓名", "參拜神社"], exp: "皇民化運動包含說國語、改日本姓名、參拜神社等。" },
          { q: "臺灣原住民族的社會組織大抵可分為哪兩大類型？", inputs: [{ label: "類型一", id: "c3_1" }, { label: "類型二", id: "c3_2" }], ans: ["部族群/父系社會/母系社會", "父系社會", "母系社會"], exp: "臺灣原住民社會主要依家族或親屬追溯分為父系社會與母系社會。" }
        ],
        app: [
          { q: "1. 某日氣象報告指出：「受地形影響，北部及東北部地區有局部陣雨，中南部地區午後有雷陣雨」。請問這種氣候型態與臺灣哪一種地形特徵及季風最具關係？", inputs: [{ label: "相關季風", id: "a0_1", unit: "" }, { label: "地形影響", id: "a0_2", unit: "" }], ans: ["東北季風", "山地"], exp: "冬季受東北季風調節及中央山脈阻擋，北部多雨。" },
          { q: "2. 為什麼早期來臺開墾的漢人多來自福建泉州與漳州？這與臺灣的什麼地理條件有關？", inputs: [{ label: "地理因素", id: "a1_1", unit: "" }, { label: "地緣關係", id: "a1_2", unit: "" }], ans: ["臺灣海峽", "近距離"], exp: "與臺灣海峽距離最近，且渡海相對便利有關。" },
          { q: "3. 清代臺灣發生「羅漢腳」過多及「三年一小反，五年一大亂」的社會治安問題，主要原因為何？", inputs: [{ label: "主因一", id: "a2_1", unit: "" }, { label: "主因二", id: "a2_2", unit: "" }], ans: ["渡臺禁令", "無家眷"], exp: "渡臺禁令限制攜眷，導致單身男性（羅漢腳）多，治安動盪。" },
          { q: "4. 日治時期日本在臺推行「工業化」政策，除了興建水庫外，還建立了哪一項大型發電工程來提供電力？", inputs: [{ label: "發電工程", id: "a3_1", unit: "" }, { label: "代表水壩", id: "a3_2", unit: "" }], ans: ["日月潭發電所", "日月潭水力發電"], exp: "日月潭發電所（今大觀發電廠）是日治時期最大的水力發電工程。" },
          { q: "5. 臺灣民主國成立於哪一年？其成立的背景是因為清廷簽訂了哪一條割臺條約？", inputs: [{ label: "成立年份", id: "a4_1", unit: "年" }, { label: "割臺條約", id: "a4_2", unit: "" }], ans: ["1895", "馬關條約"], exp: "1895年因《馬關條約》將臺灣割讓給日本，臺灣士紳成立臺灣民主國抵抗。" }
        ]
      },

      // === 社會卷二 ===
      {
        id: 1,
        title: "第 2 套社會模擬試卷 (卷二)",
        mc: [
          { q: "臺灣地形崎嶇，平原主要分佈在下列哪一個方位？", ops: ["東部", "西部", "北部", "南部"], ans: "2", exp: "選 (2)。臺灣西部因河流沖積，擁有較寬廣的平原（如嘉南平原）。" },
          { q: "下列哪一個原住民族群屬於「母系社會」，財產與家務繼承主要由女性負責？", ops: ["排灣族", "泰雅族", "阿美族", "布農族"], ans: "3", exp: "選 (3)。阿美族為典型的母系社會。" },
          { q: "荷蘭統治時期，主要引進哪一種勞動力來臺開墾蔗園與稻田？", ops: ["日本勞工", "中國大陸移民（漢人）", "南洋土著", "歐洲雇工"], ans: "2", exp: "選 (2)。荷蘭人招募漢人來臺開墾。" },
          { q: "清代臺灣開港通商後，哪一種經濟作物成為當時臺灣最重要的出口商品，賺取大量外匯？", ops: ["稻米", "茶葉", "蔗糖", "樟腦"], ans: "2", exp: "選 (2)。茶葉（尤其是烏龍茶）在開港後大受國際市場歡迎。" },
          { q: "日治時期總督府實施「保甲制度」的主要目的為何？", ops: ["推行國民教育", "加強治安控制與戶口清查", "發展工商貿易", "宣傳宗教信仰"], ans: "2", exp: "選 (2)。保甲制度採連坐法，藉此加強基層社會控制。" }
        ],
        fill: [
          { q: "地勢平坦、土壤肥沃且坡度平緩的地形稱為 <input id='f0_0' class='math-input border-b-2 border-slate-400 w-24 text-amber-700 font-bold'>。", items: [{ id: "f0_0", ans: ["平原"] }], ptsPerItem: 6, exp: "平原是最適合農耕與聚落發展的地形。" },
          { q: "傳統排灣族與魯凱族的社會階級分明，貴族與 <input id='f1_0' class='math-input border-b-2 border-slate-400 w-24 text-amber-700 font-bold'> 之間有嚴格的身分界線。", items: [{ id: "f1_0", ans: ["平民"] }], ptsPerItem: 6, exp: "排灣與魯凱族具有嚴格的階級社會制度（貴族與平民）。" },
          { q: "鄭氏時期，陳永華建議在全臺各地建立學校，推行儒家教育，其中位於臺南的孔廟被稱為「<input id='f2_0' class='math-input border-b-2 border-slate-400 w-24 text-amber-700 font-bold'>」。", items: [{ id: "f2_0", ans: ["全臺首學"] }], ptsPerItem: 6, exp: "臺南孔廟為臺灣第一座孔廟，有全臺首學之稱。" },
          { q: "清代開港通商以後，外商在臺北 <input id='f3_0' class='math-input border-b-2 border-slate-400 w-24 text-amber-700 font-bold'> 設立洋行，帶動當地茶葉加工與貿易的繁榮。", items: [{ id: "f3_0", ans: ["大稻埕"] }], ptsPerItem: 6, exp: "大稻埕因茶葉貿易而崛起成為商業重鎮。" },
          { q: "日治時期臺灣的第一條鐵路是從基隆通往 <input id='f4_0' class='math-input border-b-2 border-slate-400 w-24 text-amber-700 font-bold'>。", items: [{ id: "f4_0", ans: ["新竹", "臺北"] }], ptsPerItem: 6, exp: "縱貫鐵路全線通車前，早期清代及日治初期主要經營基隆至新竹段。" }
        ],
        calc: [
          { q: "請列舉臺灣三大地形中的另外兩種（扣除平原）：", inputs: [{ label: "地形一", id: "c0_1" }, { label: "地形二", id: "c0_2" }], ans: ["山地", "臺地", "丘陵", "盆地"], exp: "臺灣五大地形包含山地、丘陵、臺地、盆地、平原。" },
          { q: "清代臺灣三大民變（或俗稱反抗事件）中，包含哪兩件？", inputs: [{ label: "事件一", id: "c1_1" }, { label: "事件二", id: "c1_2" }], ans: ["朱一貴事件", "林爽文事件", "戴潮春事件"], exp: "清代臺灣三大民變為朱一貴、林爽文、戴潮春事件。" },

    function clean(str) {
      if (!str) return '';
      return str.toString().trim().toLowerCase().replace(/\s+/g, '');
    }

    function isAnswerMatch(userVal, expected) {
      const u = clean(userVal);
      if (!u) return false;
      if (Array.isArray(expected)) {
        return expected.some(exp => u.includes(clean(exp)) || clean(exp).includes(u));
      }
      return u.includes(clean(expected)) || clean(expected).includes(u);
    }

    function submitExam() {
      saveCurrentInputs();
      userState[currentExamIndex].submitted = true;
      const score = evaluateCurrentExam(true);
      userState[currentExamIndex].score = score;
      renderExam(currentExamIndex);
      window.scrollTo({ top: 0, behavior: 'smooth' });

      let score = 0;

      exam.mc.forEach((item, idx) => {
        const selected = document.querySelector(`input[name="mc_${idx}"]:checked`);
        const block = document.getElementById(`block_mc_${idx}`);
        const isCorrect = selected && selected.value === item.ans;
        if (isCorrect) score += 3;
        setBlockStyle(block, isCorrect);
      });

      exam.fill.forEach((item, idx) => {
        const block = document.getElementById(`block_fill_${idx}`);
        let correctItemCount = 0;

        item.items.forEach(it => {
          const userVal = document.getElementById(it.id)?.value;
          if (isAnswerMatch(userVal, it.ans)) {
            correctItemCount++;
            score += item.ptsPerItem;
          }
        });

        const isFullyCorrect = (correctItemCount === item.items.length);
        setBlockStyle(block, isFullyCorrect);
      });

      exam.calc.forEach((item, idx) => {
        const block = document.getElementById(`block_calc_${idx}`);
        let correctCount = 0;
        item.inputs.forEach((inp, iIdx) => {
          const val = document.getElementById(inp.id)?.value;
          if (isAnswerMatch(val, item.ans[iIdx])) correctCount++;
        });
        const isCorrect = (correctCount === item.inputs.length);
        if (isCorrect) score += 5;
        setBlockStyle(block, isCorrect);
      });

      exam.app.forEach((item, idx) => {
        const block = document.getElementById(`block_app_${idx}`);
        let correctCount = 0;
        item.inputs.forEach((inp, iIdx) => {
          const val = document.getElementById(inp.id)?.value;
          if (isAnswerMatch(val, item.ans[iIdx])) correctCount++;
        });
        const isCorrect = (correctCount === item.inputs.length);
        if (isCorrect) score += 7;
        setBlockStyle(block, isCorrect);
      });

      return Math.round(score);
    }

    function setBlockStyle(block, isCorrect) {
      if (!block) return;
      block.classList.remove('bg-emerald-50/40', 'bg-rose-50/40', 'border-emerald-400', 'border-rose-400');
      if (isCorrect) {
        block.classList.add('bg-emerald-50/40', 'border', 'border-emerald-400');
      } else {
        block.classList.add('bg-rose-50/40', 'border', 'border-rose-400');
      }
    }

    function getScoreComment(score) {
      if (score === 100) return "太棒了！滿分 100 分！社會科觀念超級扎實！";
      if (score >= 80) return "表現優異！歷史與地理脈絡掌握得很棒！";
      if (score >= 60) return "順利及格！再多看幾次詳細解析，一定能更進步！";
      return "加油！檢視錯題解析，重新搞懂歷史時間軸與地理觀念再試一次！";
    }

    function resetCurrentExam() {
      if (!confirm(`確定要重置 ${examDatabase[currentExamIndex].title} 的答案嗎？`)) return;
      userState[currentExamIndex] = { submitted: false, score: 0, inputs: {} };
      renderExam(currentExamIndex);
    }
  </script>
</body>
</html>
