<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國小六年級社會科 第一次段考模擬測驗題庫系統 (10套完整試卷)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .social-input {
      font-family: inherit;
      text-align: center;
    }
    @media print {
      .no-print { display: none !important; }
      .exam-container { border: none !important; box-shadow: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
      .explanation-block { display: block !important; }
      body { background-color: white !important; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-8 text-slate-800 font-sans">

  <!-- 頂部導覽與切換面板 -->
  <header class="max-w-4xl mx-auto mb-6 bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-slate-200 no-print">
    <div class="flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full">南一版 第1~2單元</span>
          <h1 class="text-xl font-bold text-slate-800">小六社會 段考模擬測驗題庫系統</h1>
        </div>
        <p class="text-xs text-slate-500 mt-1">範圍：日治時期臺灣的發展與變遷、邁向民主的社會 [10套完整卷]</p>
      </div>

      <!-- 卷別切換區 -->
      <div class="flex items-center gap-2 w-full md:w-auto justify-between md:justify-end">
        <button onclick="prevExam()" id="prevBtnHeader" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> 上一頁
        </button>
        
        <select id="examSelector" onchange="changeExam(parseInt(this.value))" class="bg-slate-50 border border-slate-300 text-slate-800 text-sm font-bold rounded-xl px-3 py-2 focus:ring-2 focus:ring-amber-500 outline-none">
          <!-- 10張試卷選項由 JS 動態注入 -->
        </select>

        <button onclick="nextExam()" id="nextBtnHeader" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition flex items-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed">
          下一頁 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>
      </div>
    </div>

    <!-- 功能按鈕列 -->
    <div class="flex justify-between items-center mt-4 pt-3 border-t border-slate-100">
      <div class="text-xs font-semibold text-slate-600">
        當前檢視：<span id="currentExamTitleDisplay" class="text-amber-700 font-bold">卷一</span>
      </div>
      <div class="flex gap-2">
        <button onclick="window.print()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg> 列印本卷
        </button>
        <button onclick="resetCurrentExam()" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold rounded-lg transition flex items-center gap-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> 重作本卷
        </button>
      </div>
    </div>
  </header>

  <!-- 得分統計看板 -->
  <div id="scoreBanner" class="max-w-4xl mx-auto mb-6 bg-gradient-to-r from-amber-600 to-orange-600 text-white p-6 rounded-2xl shadow-lg hidden no-print">
    <div class="flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h2 class="text-2xl font-black" id="bannerExamTitle">卷一 測驗完成！</h2>
        <p class="text-amber-100 text-sm mt-1" id="scoreComment">評語載入中...</p>
      </div>
      <div class="flex items-baseline gap-1 bg-white/20 backdrop-blur-md px-6 py-3 rounded-2xl border border-white/30">
        <span class="text-5xl font-black" id="totalScore">0</span>
        <span class="text-lg opacity-80">/ 100 分</span>
      </div>
    </div>
  </div>

  <!-- 試卷主體渲染區 -->
  <main id="examContainer" class="exam-container max-w-4xl mx-auto bg-white p-6 md:p-10 rounded-2xl shadow-md border border-slate-200">
    <!-- JS 會在此載入對應試卷內容 -->
  </main>

  <!-- 底部導覽與交卷列 -->
  <footer class="max-w-4xl mx-auto mt-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4 no-print">
    <div class="flex gap-2 w-full md:w-auto">
      <button onclick="prevExam()" id="prevBtnFooter" class="flex-1 md:flex-none px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition flex items-center justify-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> 上一頁
      </button>
      <button onclick="nextExam()" id="nextBtnFooter" class="flex-1 md:flex-none px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition flex items-center justify-center gap-1 disabled:opacity-40 disabled:cursor-not-allowed">
        下一頁 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>

    <button onclick="submitExam()" class="w-full md:w-auto px-8 py-3 bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-700 hover:to-orange-700 text-white font-bold text-base rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      交卷對答案 (計算本卷得分)
    </button>
  </footer>

  <script>
    // -------------------------------------------------------------
    // 10 份試卷資料庫 (南一版六上社會 第一、二單元完整題型與解析)
    // -------------------------------------------------------------
    const examDatabase = [
      // === 卷一 ===
      {
        id: 0,
        title: "第 1 套模擬試卷 (卷一)",
        mc: [
          { q: "清帝國在甲午戰爭敗給日本後，簽署哪一個條約將臺灣與澎湖割讓給日本？", ops: ["天津條約", "南京條約", "馬關條約", "北京條約"], ans: "3", exp: "1894年爆發甲午戰爭，隔年(1895年)清帝國戰敗，簽署《馬關條約》將臺灣與澎湖割讓給日本。" },
          { q: "日治時期總督府實施「保甲制度」，其中規定多少戶為「一甲」？", ops: ["5戶", "10戶", "50戶", "100戶"], ans: "2", exp: "保甲制度規定10戶為一甲、10甲為一保，並設甲長與保長協助警察維護地方治安。" },
          { q: "日治時期由八田與一設計興建，解決嘉南平原缺水問題的重要水利設施為何？", ops: ["瑠公圳", "曹公圳", "嘉南大圳", "彰化八堡圳"], ans: "3", exp: "嘉南大圳由日本技師八田與一設計，利用烏山頭水庫與曾文溪水資源，大幅改善嘉南平原農田灌溉。" },
          { q: "民國36年（1947年）因為專賣局人員查緝私菸失當所引發的全臺重大歷史事件為何？", ops: ["焦吧哖事件", "美麗島事件", "二二八事件", "霧社事件"], ans: "3", exp: "民國36年2月27日因查緝私菸引發流血衝突，進而爆發影響全臺的「二二八事件」。" },
          { q: "我國的最高根本大法，規定人民的基本權利與義務，且所有法律皆不可違反的是？", ops: ["民法", "刑法", "中華民國憲法", "地方自治法"], ans: "3", exp: "《中華民國憲法》是國家的根本大法，保障人民權利並規定國家組織架構。" }
        ],
        fill: [
          { q: "日治初期，部分官民推舉唐景崧成立「<input id='f0_0' class='social-input border-b-2 border-slate-400 w-28 text-amber-800 font-bold'>」以抵擋日軍接收，但不到半年便宣告失敗。", ans: ["台灣民主國", "臺灣民主國"], exp: "1895年臺灣官民成立「臺灣民主國」，尋求外援並抵抗日軍進駐。" },
          { q: "日治時期專賣制度統一管理販售的物資包括：樟腦、食鹽、菸草、酒類以及 <input id='f1_0' class='social-input border-b-2 border-slate-400 w-24 text-amber-800 font-bold'>。", ans: ["鴉片"], exp: "總督府透過專賣鴉片、樟腦、食鹽、菸草、酒類等商品來籌措基礎建設資金。" },
          { q: "西元1915年由余清芳等人領導的漢人最大規模武裝抗日事件是 <input id='f2_0' class='social-input border-b-2 border-slate-400 w-28 text-amber-800 font-bold'> 事件（又稱噍吧哖事件）。", ans: ["玉井", "西來庵", "噍吧哖"], exp: "西元1915年在臺南玉井爆發西來庵事件（噍吧哖事件），為漢人最後一次大規模武裝抗日。" },
          { q: "我國中央政府分為五院，其中負責制定法律與審查預算的是 <input id='f3_0' class='social-input border-b-2 border-slate-400 w-24 text-amber-800 font-bold'> 院。", ans: ["立法院", "立法"], exp: "立法院為我國中央立法機關，負責法律制定與預算審查。" },
          { q: "憲法第21條規定「人民有受國民教育之權利與義務」，因此接受國民教育既是人民的權利，也是人民的 <input id='f4_0' class='social-input border-b-2 border-slate-400 w-20 text-amber-800 font-bold'>。", ans: ["義務"], exp: "接受國民教育兼具「基本權利」與「基本義務」雙重性質。" }
        ],
        qa: [
          { q: "1. 請簡述日治時期初等教育機構中，「小學校」與「公學校」主要的招收對象有何差異？", inputs: [{ label: "答案簡述", id: "q0_0" }], ans: ["小學校招收日本兒童，公學校招收台灣兒童"], exp: "日治時期初等教育依語言與身分劃分：小學校主要供日籍兒童就讀，公學校主要供臺籍兒童就讀。" },
          { q: "2. 日治時期林獻堂、蔣渭水等人成立「臺灣文化協會」，主要透過哪些非武力方式提升臺灣人的文化素養與權利意識？", inputs: [{ label: "答案簡述", id: "q1_0" }], ans: ["開設讀報社、巡迴演講、播放電影"], exp: "臺灣文化協會透過設置讀報社、舉辦巡迴演講、播放電影等文化啟蒙方式宣導新觀念。" },
          { q: "3. 請列舉我國憲法規定人民應盡的三大「基本義務」。", inputs: [{ label: "三大義務", id: "q2_0" }], ans: ["納稅、服兵役、接受國民教育"], exp: "憲法規定的三大基本義務為：納稅、服兵役（滿18歲男子）、接受國民教育。" },
          { q: "4. 民國76年（1987年）政府宣佈解除哪一項戒嚴令，讓臺灣人民的言論、集會與結社自由逐步恢復？", inputs: [{ label: "解除法規", id: "q3_0" }], ans: ["戒嚴令", "戒嚴"], exp: "民國76年政府宣佈解除戒嚴令，開啟臺灣民主化的新時代。" }
        ],
        app: [
          { q: "1. 小明的阿公回憶起小時候生活：家裡門口掛著「國語家庭」認證證書，學校要求改用日本姓氏，且需要到神社參拜。請問這屬於日治時期哪一個階段的統治政策？其背景為何？", inputs: [{ label: "政策名稱", id: "a0_0", unit: "" }, { label: "推行背景", id: "a0_1", unit: "" }], ans: ["皇民化運動", "中日戰爭爆發"], exp: "西元1937年中日戰爭爆發後，總督府為強化臺灣人對日本的認同，推動「皇民化運動」（含講日語、改日本姓氏、參拜神社等）。" },
          { q: "2. 探究題：日治時期總督府引入「自來水設施」與「公共市場」，對臺灣當時的社會衛生與人民生活帶來了哪些改變？", inputs: [{ label: "自來水優點", id: "a1_0", unit: "" }, { label: "公共市場優點", id: "a1_1", unit: "" }], ans: ["提供乾淨用水減少傳染病", "採光通風好提升食品安全"], exp: "自來水提供乾淨飲水並控制霍亂、傷寒等傳染病；公共市場改善傳統攤販露天曝曬問題，提升食品衛生品質。" },
          { q: "3. 民主運作模擬：若中央政府想要推動「校園營養午餐專法」，請寫出行政院與立法院在此過程中的權責分工。", inputs: [{ label: "行政院權責", id: "a2_0", unit: "" }, { label: "立法院權責", id: "a2_1", unit: "" }], ans: ["訂定政策與執行法律", "審查預算與制定法律"], exp: "行政院負責提出並執行政策法案，立法院負責審查預算與審議通過法律。" },
          { q: "4. 民主發展里程碑：請依照時間先後順序，排列下列臺灣民主發展事件：（A）首次總統直接選舉 （B）解除戒嚴 （C）野百合學運 （D）首次政黨輪替。", inputs: [{ label: "時間排序(用字母)", id: "a3_0", unit: "" }], ans: ["B->C->A->D", "B,C,A,D", "BCAD"], exp: "時間順序為：(B)解除戒嚴(民國76) -> (C)野百合學運(民國79) -> (A)首次總統直選(民國85) -> (D)首次政黨輪替(民國89)。" }
        ]
      },

      // === 卷二 ===
      {
        id: 1,
        title: "第 2 套模擬試卷 (卷二)",
        mc: [
          { q: "日治時期被人民稱為「大人」，職權涵蓋戶口調查、衛生宣導、思想取締與治安維護的官方角色是？", ops: ["保長", "甲長", "警察", "保正"], ans: "3", exp: "日治時期警察權力極大，深入生活各層面，民眾常尊稱其為「大人」。" },
          { q: "西元1930年由賽德克族領袖莫那·魯道帶領族人發起，對抗日警壓迫的著名武裝抗日事件是？", ops: ["西來庵事件", "霧社事件", "二二八事件", "美麗島事件"], ans: "2", exp: "西元1930年南投仁愛鄉發生「霧社事件」，賽德克族人因不滿壓迫發起武裝抗日。" },
          { q: "日治時期連結臺灣西部各大主要城市，加速貨物流通的重要交通建設是？", ops: ["北宜高速公路", "西部縱貫鐵路", "東臺灣臨海公路", "阿里山森林鐵路"], ans: "2", exp: "西部縱貫鐵路通車後，貫通臺灣南北，大幅縮短交通時間與貨物運輸成本。" },
          { q: "我國憲法保障人民有言論、信仰、居住與遷徙等自由，這屬於下列哪一類基本權利？", ops: ["平等權", "自由權", "參政權", "受益權"], ans: "2", exp: "言論、出版、居住、遷徙、信仰等自由均屬於憲法保障的「自由權」。" },
          { q: "臺灣地區於西元1996年（民國85年）實現了哪一項民主制度的重要里程碑？", ops: ["實施九年國民教育", "解除戒嚴令", "首次總統直接選舉", "首次政黨輪替"], ans: "3", exp: "民國85年（1996年）臺灣舉行歷史上第一次總統直接選舉，由人民親自投票選出國家元首。" }
        ],
        fill: [
          { q: "日治時期總督府為獲得山林資源（如木材），特別興建了 <input id='f0_1' class='social-input border-b-2 border-slate-400 w-32 text-amber-800 font-bold'> 鐵路。", ans: ["阿里山森林", "阿里山"], exp: "阿里山森林鐵路係為了運送山林木材資源而興建的高山鐵路。" },
          { q: "西元1925年彰化蔗農因不滿糖廠秤重不公與收購價格過低，爆發了「<input id='f1_1' class='social-input border-b-2 border-slate-400 w-28 text-amber-800 font-bold'> 蔗農事件」。", ans: ["二林"], exp: "1925年二林蔗農事件為日治時期臺灣農民爭取公平待遇的重要社會運動。" },
          { q: "日治時期引進西方標準時間，規定一天為24小時，一週以 <input id='f2_1' class='social-input border-b-2 border-slate-400 w-20 text-amber-800 font-bold'> 為休息日，培養民眾守時觀念。", ans: ["星期日", "週日"], exp: "總督府引進星期制與24小時制，並將星期日定為休假日。" },
          { q: "我國地方政府分為行政與立法機關，例如縣市政府屬於行政機關，而 <input id='f3_1' class='social-input border-b-2 border-slate-400 w-24 text-amber-800 font-bold'> 則屬於地方立法機關。", ans: ["縣市議會", "市議會", "縣議會"], exp: "地方立法機關包括縣市議會、鄉鎮市民代表會等，負責監督地方政府與審查預算。" },
          { q: "憲法保障人民可以參加選舉投票選出公職人員，或是參加考試擔任公務員，這是屬於人民的 <input id='f4_1' class='social-input border-b-2 border-slate-400 w-20 text-amber-800 font-bold'> 權。", ans: ["參政", "參政權"], exp: "選舉、罷免、創制、複決及應考試服公職等均為「參政權」。" }
        ],
        qa: [

    // 當前運作狀態 (紀錄10張試卷各自的答題與得分)
    let currentExamIndex = 0;
    const userState = Array.from({ length: 10 }, () => ({
      submitted: false,
      score: 0,
      inputs: {}
    }));

    // 初始化頁面
    window.onload = function() {
      initSelector();
      renderExam(0);
    };

    // 初始化下拉選單
    function initSelector() {
      const selector = document.getElementById('examSelector');
      selector.innerHTML = examDatabase.map((e, idx) => 
        `<option value="${idx}">${e.title}</option>`
      ).join('');
    }

    // 切換試卷
    function changeExam(index) {
      if (index < 0 || index >= examDatabase.length) return;
      saveCurrentInputs();
      currentExamIndex = index;
      document.getElementById('examSelector').value = index;
      renderExam(index);
    }

    function prevExam() {
      if (currentExamIndex > 0) changeExam(currentExamIndex - 1);
    }

    function nextExam() {
      if (currentExamIndex < examDatabase.length - 1) changeExam(currentExamIndex + 1);
    }

    // 保存目前頁面的輸入內容
    function saveCurrentInputs() {
      const state = userState[currentExamIndex].inputs;
      document.querySelectorAll('#examContainer input').forEach(input => {
        if (input.type === 'radio') {
          if (input.checked) state[input.name] = input.value;
        } else {
          state[input.id] = input.value;
        }
      });
    }

    // 渲染指定試卷
    function renderExam(index) {
      const exam = examDatabase[index];
      const state = userState[index];

      // 更新按鈕狀態
      document.getElementById('prevBtnHeader').disabled = (index === 0);
      document.getElementById('nextBtnHeader').disabled = (index === examDatabase.length - 1);
      document.getElementById('prevBtnFooter').disabled = (index === 0);
      document.getElementById('nextBtnFooter').disabled = (index === examDatabase.length - 1);
      document.getElementById('currentExamTitleDisplay').innerText = exam.title;

      // 渲染得分看板狀態
      const banner = document.getElementById('scoreBanner');
      if (state.submitted) {
        document.getElementById('bannerExamTitle').innerText = `${exam.title} 測驗成果`;
        document.getElementById('totalScore').innerText = state.score;
        document.getElementById('scoreComment').innerText = getScoreComment(state.score);
        banner.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
      }

      // 建立 HTML
      let html = `
        <div class="border-b-2 border-amber-800 pb-4 mb-8">
          <div class="text-center mb-4">
            <h1 class="text-2xl font-black text-slate-900">國民小學 六年級第一學期 社會科評量模擬試題</h1>
            <p class="text-sm font-bold text-amber-700 mt-1">【${exam.title}】</p>
            <p class="text-xs text-slate-500 mt-0.5">範圍：第一單元 日治時期臺灣的發展與變遷 ＆ 第二單元 邁向民主的社會 (南一版)</p>
          </div>
          <div class="flex justify-between items-end text-sm font-semibold text-slate-700">
            <div>姓名：<input type="text" id="studentName" value="${state.inputs['studentName'] || ''}" placeholder="請輸入姓名" class="no-print border-b-2 border-slate-400 outline-none px-2 py-0.5 w-32 font-normal"></div>
            <div>總分：100 分</div>
          </div>
        </div>

        <!-- 一、單選題 -->
        <section class="mb-10">
          <h2 class="text-lg font-bold text-slate-900 border-b border-slate-300 pb-2 mb-6">一、 單選題 (每題 4 分，共 20 分)</h2>
          <div class="space-y-6">
      `;

      exam.mc.forEach((item, idx) => {
        const qKey = `mc_${idx}`;
        const userVal = state.inputs[qKey];
        html += `
          <div class="q-block p-4 rounded-xl border border-slate-100 transition" id="block_mc_${idx}">
            <p class="font-semibold text-slate-800 mb-3">${idx + 1}. ${item.q}</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm pl-2">
              ${item.ops.map((op, oIdx) => `
                <label class="flex items-center gap-2 p-2 rounded-lg border border-slate-200 hover:bg-slate-50 cursor-pointer">
                  <input type="radio" name="${qKey}" value="${oIdx + 1}" ${userVal == (oIdx + 1) ? 'checked' : ''} class="w-4 h-4 text-amber-600">
                  (${oIdx + 1}) ${op}
                </label>
              `).join('')}
            </div>
            <div class="explanation-block ${state.submitted ? '' : 'hidden'} mt-3 p-3 bg-emerald-50 text-emerald-900 rounded-lg text-sm border border-emerald-200">
              <strong>解析：</strong>${item.exp}
            </div>
          </div>
        `;
      });

      html += `</div></section><!-- 二、填空題 -->
        <section class="mb-10">
          <h2 class="text-lg font-bold text-slate-900 border-b border-slate-300 pb-2 mb-6">二、 填空題 (每題 6 分，共 30 分)</h2>
          <div class="space-y-6">
      `;

      exam.fill.forEach((item, idx) => {
        html += `
          <div class="q-block p-4 rounded-xl border border-slate-100 transition" id="block_fill_${idx}">
            <p class="font-medium text-slate-800">${idx + 1}. ${item.q}</p>
            <div class="explanation-block ${state.submitted ? '' : 'hidden'} mt-3 p-3 bg-emerald-50 text-emerald-900 rounded-lg text-sm border border-emerald-200">
              <strong>解析：</strong>${item.exp}
            </div>
          </div>
        `;
      });

      html += `</div></section><!-- 三、問答與觀念題 -->
        <section class="mb-10">
          <h2 class="text-lg font-bold text-slate-900 border-b border-slate-300 pb-2 mb-6">三、 問答與觀念題 (每題 6 分，共 24 分)</h2>
          <div class="space-y-6">
      `;

      exam.qa.forEach((item, idx) => {
        html += `
          <div class="q-block border border-slate-200 p-4 rounded-xl flex flex-col justify-between" id="block_qa_${idx}">
            <p class="font-semibold text-slate-800">${idx + 1}. ${item.q}</p>
            <div class="mt-3 pt-3 border-t border-slate-100 space-y-2 text-sm">
              ${item.inputs.map((inp) => {
                const val = state.inputs[inp.id] || '';
                return `<div>${inp.label}：<input type="text" id="${inp.id}" value="${val}" placeholder="輸入關鍵字答案" class="social-input border border-slate-300 rounded px-3 py-1.5 w-full md:w-3/4 text-left font-bold text-amber-900"></div>`;
              }).join('')}
            </div>
            <div class="explanation-block ${state.submitted ? '' : 'hidden'} mt-3 p-3 bg-emerald-50 text-emerald-900 rounded-lg text-sm border border-emerald-200">
              <strong>完整解析與參考答案：</strong>${item.exp}
            </div>
          </div>
        `;
      });

      html += `</div></section><!-- 四、情境應用與探究題 -->
        <section class="mb-6">
          <h2 class="text-lg font-bold text-slate-900 border-b border-slate-300 pb-2 mb-6">四、 情境應用與探究題 (每題 6.5 分，共 26 分)</h2>
          <div class="space-y-6">
      `;

      exam.app.forEach((item, idx) => {
        html += `
          <div class="q-block p-4 border border-slate-200 rounded-xl transition" id="block_app_${idx}">
            <p class="font-medium text-slate-800 mb-3">${idx + 1}. ${item.q}</p>
            <div class="bg-slate-50 p-4 rounded-lg flex flex-col gap-3 text-sm">
              ${item.inputs.map(inp => {
                const val = state.inputs[inp.id] || '';
                return `<div class="flex flex-col md:flex-row md:items-center gap-2">
                  <span class="font-semibold text-slate-700 min-w-[120px]">${inp.label}：</span>
                  <input type="text" id="${inp.id}" value="${val}" placeholder="請簡答..." class="social-input border border-slate-300 rounded px-3 py-1.5 flex-1 text-left font-bold text-amber-900">
                </div>`;
              }).join('')}
            </div>
            <div class="explanation-block ${state.submitted ? '' : 'hidden'} mt-3 p-3 bg-emerald-50 text-emerald-900 rounded-lg text-sm border border-emerald-200">
              <strong>解析與引導：</strong>${item.exp}
            </div>
          </div>
        `;
      });

      html += `</div></section>`;

      document.getElementById('examContainer').innerHTML = html;

      // 【修復】重新填入填空題 (fill) 之前已儲存的答案
      exam.fill.forEach((_, idx) => {
        const inputElem = document.getElementById(`f${idx}_${index}`);
        if (inputElem && state.inputs[inputElem.id] !== undefined) {
          inputElem.value = state.inputs[inputElem.id];
        }
      });

      // 如果該卷已經提交過，重新顯示對錯標示
      if (state.submitted) {
        evaluateCurrentExam(false);
      }
    }

    // 比對字串工具 (清理空格與符號)
    function clean(str) {
      if (!str) return '';
      return str.toString().trim().toLowerCase()
        .replace(/\s+/g, '')
        .replace(/[，。；：,.;:]/g, '')
        .replace(/台/g, '臺');
    }

    // 評分本卷
    function submitExam() {
      saveCurrentInputs();
      userState[currentExamIndex].submitted = true;
      const score = evaluateCurrentExam(true);
      userState[currentExamIndex].score = score;
      renderExam(currentExamIndex);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 執行分數計算與邊框標示
    function evaluateCurrentExam(shouldAddScore) {
      const exam = examDatabase[currentExamIndex];
      let score = 0;

      // 1. 單選題 (20分)
      exam.mc.forEach((item, idx) => {
        const selected = document.querySelector(`input[name="mc_${idx}"]:checked`);
        const block = document.getElementById(`block_mc_${idx}`);
        const isCorrect = selected && selected.value === item.ans;
        if (isCorrect) score += 4;
        setBlockStyle(block, isCorrect);
      });

      // 2. 填空題 (30分)
      exam.fill.forEach((item, idx) => {
        const block = document.getElementById(`block_fill_${idx}`);
        const inputElem = document.getElementById(`f${idx}_${currentExamIndex}`);
        const userVal = clean(inputElem ? inputElem.value : '');
        const isCorrect = item.ans.some(ansOpt => userVal.includes(clean(ansOpt)));
        if (isCorrect) score += 6;
        setBlockStyle(block, isCorrect);
      });

      // 3. 問答觀念題 (24分)
      exam.qa.forEach((item, idx) => {
        const block = document.getElementById(`block_qa_${idx}`);
        let correctCount = 0;
        item.inputs.forEach((inp) => {
          const userVal = clean(document.getElementById(inp.id)?.value);
          if (item.ans.some(ansOpt => userVal.includes(clean(ansOpt)) || clean(ansOpt).includes(userVal))) {
            if (userVal.length >= 1) correctCount++;
          }
        });
        const isCorrect = (correctCount > 0);
        if (isCorrect) score += 6;
        setBlockStyle(block, isCorrect);
      });

      // 4. 情境應用題 (26分 - 每題 6.5分)
      exam.app.forEach((item, idx) => {
        const block = document.getElementById(`block_app_${idx}`);
        let matchCount = 0;
        item.inputs.forEach((inp) => {
          const userVal = clean(document.getElementById(inp.id)?.value);
          if (item.ans.some(ansOpt => userVal.includes(clean(ansOpt)) || clean(ansOpt).includes(userVal))) {
            if (userVal.length >= 1) matchCount++;
          }
        });
        const isCorrect = (matchCount > 0);
        if (isCorrect) score += 6.5;
        setBlockStyle(block, isCorrect);
      });

      return Math.round(score);
    }

    function setBlockStyle(block, isCorrect) {
      if (!block) return;
      block.classList.remove('bg-emerald-50/40', 'bg-rose-50/40', 'border-emerald-400', 'border-rose-400');
      if (isCorrect) {
        block.classList.add('bg-emerald-50/40', 'border', 'border-emerald-400');
      } else {
        block.classList.add('bg-rose-50/40', 'border', 'border-rose-400');
      }
    }

    function getScoreComment(score) {
      if (score === 100) return "優秀！滿分 100 分！對於日治時期建設與臺灣民主發展歷程瞭如指掌！";
      if (score >= 80) return "表現優異！觀念相當清晰，仔細複習錯題解析能更加熟練！";
      if (score >= 60) return "順利及格！建議對照錯題的詳細解析，加強記憶相關歷史事件與憲法知識！";
      return "再接再勵！請詳細閱讀每題的解答與歷史背景解析，隨時點擊重作再試一次！";
    }

    // 重置本卷
    function resetCurrentExam() {
      if (!confirm(`確定要重置 ${examDatabase[currentExamIndex].title} 的答案嗎？`)) return;
      userState[currentExamIndex] = { submitted: false, score: 0, inputs: {} };
      renderExam(currentExamIndex);
    }
  </script>
</body>
</html>
